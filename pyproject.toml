[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dhhfsp-compare"
version = "0.1.0"
description = "Independent HGNN-PPO (Bao et al. 2026, makespan-only adaptation) implementation and comparison harness for the DHHFSP scheduling problem with missing operations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "ortools>=9.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: long-running acceptance tests (random rollout over hundreds of instances)",
]
